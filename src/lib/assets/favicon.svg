<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </radialGradient>
    <linearGradient id="hourHandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="minHandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring with Sky Blue Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#dialGrad)" stroke="#38bdf8" stroke-width="28"/>

  <!-- Inner Track -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 12"/>

  <!-- Hour Tick Marks (12, 3, 6, 9 major + other hours) -->
  <g stroke-linecap="round">
    <!-- Major ticks -->
    <line x1="256" y1="58" x2="256" y2="94" stroke="#38bdf8" stroke-width="16"/>
    <line x1="454" y1="256" x2="418" y2="256" stroke="#38bdf8" stroke-width="16"/>
    <line x1="256" y1="454" x2="256" y2="418" stroke="#38bdf8" stroke-width="16"/>
    <line x1="58" y1="256" x2="94" y2="256" stroke="#38bdf8" stroke-width="16"/>

    <!-- Minor hour ticks -->
    <line x1="355" y1="84" x2="337" y2="115" stroke="#64748b" stroke-width="10"/>
    <line x1="428" y1="157" x2="397" y2="175" stroke="#64748b" stroke-width="10"/>
    <line x1="428" y1="355" x2="397" y2="337" stroke="#64748b" stroke-width="10"/>
    <line x1="355" y1="428" x2="337" y2="397" stroke="#64748b" stroke-width="10"/>
    <line x1="157" y1="428" x2="175" y2="397" stroke="#64748b" stroke-width="10"/>
    <line x1="84" y1="355" x2="115" y2="337" stroke="#64748b" stroke-width="10"/>
    <line x1="84" y1="157" x2="115" y2="175" stroke="#64748b" stroke-width="10"/>
    <line x1="157" y1="84" x2="175" y2="115" stroke="#64748b" stroke-width="10"/>
  </g>

  <!-- Hour Hand: Sky Blue pointing to 10 o'clock (~305 deg) -->
  <line x1="256" y1="256" x2="162" y2="122" stroke="url(#hourHandGrad)" stroke-width="32" stroke-linecap="round"/>

  <!-- Minute Hand: Sunny Gold pointing to 2 o'clock (~60 deg) -->
  <line x1="256" y1="256" x2="390" y2="178" stroke="url(#minHandGrad)" stroke-width="22" stroke-linecap="round"/>

  <!-- Center Hub with Layered Depth -->
  <circle cx="256" cy="256" r="32" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="18" fill="#0c1222"/>
  <circle cx="256" cy="256" r="10" fill="#fbbf24"/>

  <!-- Playful Gold Sparkle Accent (Top Right) -->
  <path d="M410 70 L416 92 L438 98 L416 104 L410 126 L404 104 L382 98 L404 92 Z" fill="#fbbf24"/>
</svg>
